name: Sync Play production versions

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      version_codes:
        description: 'Confirmed serving production version codes, comma separated. Leave blank to read Google Play.'
        type: string
      dry_run:
        description: 'Show the result without pushing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: play-production-sync
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.PLAY_REPORTING_PROVIDER != '' && vars.PLAY_REPORTING_SERVICE_ACCOUNT != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Authenticate to Play Developer Reporting
        if: inputs.version_codes == ''
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_REPORTING_PROVIDER }}
          service_account: ${{ vars.PLAY_REPORTING_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/playdeveloperreporting
          create_credentials_file: false
          export_environment_variables: false
      - name: Record the serving production versions
        env:
          PLAY_REPORTING_TOKEN: ${{ steps.auth.outputs.access_token }}
          CONFIRMED_CODES: ${{ inputs.version_codes }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [[ -n "$CONFIRMED_CODES" ]]; then
            args+=("--version-codes=$CONFIRMED_CODES")
          fi
          python3 tools/sync_play_production.py "${args[@]}"
          git add -- docs/google-play-production.json
          git diff --cached --quiet && exit 0
          if [[ "$DRY_RUN" == 'true' ]]; then
            git diff --cached
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record serving Google Play production versions'
          git push origin HEAD:refs/heads/main
